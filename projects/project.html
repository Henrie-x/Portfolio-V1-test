<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Document</title>
  <link rel="stylesheet" href="project.css">
  <link rel="stylesheet" href="../css/variable.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <section class="project_detail">
    <div class="back_btn">
      <a href="../index.html">
        <i class="fa-solid fa-arrow-left-long"></i>
        Back to Project
      </a>
    </div>
    <div class="hero">
      <img id="heroImg" src="../images/product/portfolio.png" alt="">
    </div>
    <div class="project_main">
      <div class="project_info">
        <h1 id="title">Boot interface Ui</h1>
        <p id="desc">A high-performance boot interface with real-time system logs and animated loading states.
          Designed with a terminal-inspired layout for a next-gen OS startup feel.</p>
        <div class="projectTags" id="proTags"></div>
        <div class="btn">
          <a href="#" class="visit" id="visitBtn">Visit website
          <i class="fa-solid fa-arrow-up-right-from-square"></i>
          </a>
          <a href="#" class="view" id="viewBtn">view source code
          <i class="fa-solid fa-arrow-up-right-from-square"></i>
          </a>
        </div>
      </div>
      <div class="right">
        <div class="right_card">
          <div class="exe">
            <i class="fa-solid fa-user"></i>
            <div class="detail">
              <h3>Role</h3>
              <p id="role"></p>
            </div>
          </div>
          <div class="exe">
             <i class="fa-solid fa-clock"></i>
            <div class="detail">
              <h3>Durarion</h3>
              <p id="dura"></p>
            </div>
          </div>
          <div class="exe">
            <i class="fa-solid fa-calendar"></i>
            <div class="detail">
              <h3>Year</h3>
              <p id="year"></p>
            </div>
          </div>
          <div class="exe">
            <i class="fa-solid fa-code"></i>
            <div class="detail">
              <h3>Tools</h3>
              <p id="tool"></p>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="project_about">
      <div class="abt_top">
        <div class="dot"></div>
        <h4>About the project</h4>
      </div>
      <p id="about"></p>
    </div>
    <div class="project_screenshot">
      <div class="screen_top">
        <div class="dot"></div>
        <h4>Projects Screenshot</h4>
      </div>
      <div class="screenshot_grid" id="screen"></div>
    </div>
  </section>
  <script src="../data.js"></script>
  <script src="project.js"></script>
</body>
</html>
