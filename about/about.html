<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Document</title>
  <link rel="stylesheet" href="about.css">
  <link rel="stylesheet" href="../css/variable.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <div class="back_btn" id="btn">
    <a href="#">
      <i class="fa-solid fa-arrow-left-long"></i>
        Back to Project
    </a>
  </div>
  <section class="about">
    <span class="about_eyebrow">About Me</span>

    <div class="about_top">
      <div class="about_photo">
        <img src="../images/about.png" alt="">
      </div>
      <div class="about_bio">
        <h2>I'm a passionate frontend developer.</h2>
        <p>I specialize in building exceptional digital experiences. Currently, I'm focused on building accessible, human-centered products.</p>
        <div class="about_info" id="about-info"></div>
      </div>
    </div>

    <div class="about_mid">
      <div class="about_skills">
        <h3>Skills</h3>
        <div id="about-skills"></div>
      </div>
      <div class="about_tools">
        <h3>Tools I use</h3>
        <div class="about_tools_grid" id="about-tools"></div>
      </div>
    </div>

    <div class="about_journey">
      <h3>My Journey</h3>
      <div class="journey_track" id="about-journey"></div>
    </div>
  </section>
  <script src="about.js"></script>
</body>
</html>
